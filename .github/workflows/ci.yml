name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile app/main.py
      - name: Import app
        run: python -c "import sys; sys.path.insert(0,'.'); from app.main import app"
      - name: Run unit tests
        run: python -m pytest -q